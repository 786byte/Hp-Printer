name: Build APK

on:
  push:
    paths-ignore: ["QuickPrint/**", ".github/workflows/quickprint.yml"]
  pull_request:
    paths-ignore: ["QuickPrint/**", ".github/workflows/quickprint.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test printer logic
        run: ./gradlew :core:test
      - name: Build APK
        run: ./gradlew :app:assembleRelease
      - name: Check the APK is installable
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          $BT/apksigner verify --print-certs $APK
          $BT/aapt2 dump badging $APK | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity)"
          cp $APK JustPrintIt.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JustPrintIt-apk
          path: JustPrintIt.apk
          if-no-files-found: error
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Just Print It 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: JustPrintIt.apk
          body: |
            **Install on your phone:** tap `JustPrintIt.apk` below, open it, and allow installing from your browser if Android asks.
            New versions install over the old one and keep your settings and page counters.
